<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Česky krok za krokem - тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F8; --ink:#1A2340; --card:#FFFFFF; --muted:#5A6788; --accent:#FFC93C; --good:#1F9D55; --bad:#E5533D;
  --ma:#1E88E5; --mi:#303F9F; --f:#C2185B; --n:#2E7D32;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1626; --ink:#E6ECF7; --card:#1B253B; --muted:#9AA8C7; --accent:#F2B705; --good:#3CC47C; --bad:#FF6F5B; --ma:#64B5F6; --mi:#A5B0FF; --f:#F48FB1; --n:#81C784; }
}
:root[data-theme="dark"]{ --bg:#0F1626; --ink:#E6ECF7; --card:#1B253B; --muted:#9AA8C7; --accent:#F2B705; --good:#3CC47C; --bad:#FF6F5B; --ma:#64B5F6; --mi:#A5B0FF; --f:#F48FB1; --n:#81C784; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100%;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.book{margin:0;color:var(--muted);font-weight:600;font-size:.9rem}
h1{font-size:2.1rem;font-weight:800;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em}
.sub{margin:2px 0 12px;color:var(--muted);font-weight:600}
.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.les{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:6px 4px;font-weight:800;cursor:pointer;font-size:1rem}
.les[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tab{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 2px;font-weight:800;font-size:.9rem;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:#1A2340}
.tab:disabled,.les:disabled,.chip:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:currentColor;vertical-align:-1px}
.g-Ma{color:var(--ma)} .g-Mi{color:var(--mi)} .g-F{color:var(--f)} .g-N{color:var(--n)}
.badge{display:inline-block;border:2px solid currentColor;border-radius:8px;padding:0 7px;font-size:.8rem;font-weight:800;margin-top:8px}

.progress{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;font-size:.95rem}
.bar{height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.help{color:var(--muted);margin:0 0 12px;font-size:.93rem}

.scene{perspective:1200px;height:300px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:22px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-shadow:6px 6px 0 var(--ink)}
.back{transform:rotateY(180deg)}
.emoji{font-size:3.6rem;line-height:1;margin-bottom:10px}
.word{font-size:2rem;font-weight:800;line-height:1.15;word-break:break-word}
.tap{position:absolute;bottom:10px;font-size:.82rem;color:var(--muted);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.btn{border:3px solid var(--ink);border-radius:14px;padding:11px 10px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--card);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{background:var(--good);color:#fff}
.btn.again{background:var(--bad);color:#fff}
.btn.wide{width:100%;margin-top:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.link{background:none;border:none;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:58px;border:3px solid var(--ink);border-radius:14px;background:var(--card);cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:6px 8px;font-weight:700;font-size:1rem;line-height:1.2}
.tile.sel{background:var(--accent);color:#1A2340}
.tile.ok{background:var(--good);color:#fff;border-color:var(--good);box-shadow:none;cursor:default}
.tile.shake{animation:shake .35s}

.q{border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:6px 6px 0 var(--ink);padding:22px 16px;text-align:center}
.q .prompt{font-size:1.55rem;font-weight:800;line-height:1.25;margin:4px 0 6px;word-break:break-word}
.q .hint{color:var(--muted);font-weight:600;margin:0 0 14px}
.bignum{font-size:3rem;font-weight:800}
.pattern{font-family:"Courier New",monospace;font-size:1.3rem;font-weight:700;letter-spacing:.14em;margin:0 0 12px;word-break:break-word}
.ans{width:100%;font:inherit;font-size:1.3rem;font-weight:700;text-align:center;padding:10px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink)}
.ans.good{border-color:var(--good)} .ans.bad{border-color:var(--bad)}
.dia{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 0}
.dia button{min-width:38px;padding:6px 0;border:2px solid var(--ink);border-radius:10px;background:var(--bg);font-weight:800;font-size:1.05rem;cursor:pointer}
.fb{margin-top:12px;font-weight:800;min-height:1.5em}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)} .fb.almost{color:#B7791F}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{border:3px solid var(--ink);border-radius:14px;background:var(--bg);padding:10px 12px;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:left}
.opt.right{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{border:3px solid currentColor;border-radius:14px;background:var(--bg);padding:12px 6px;font-weight:800;cursor:pointer}
.gbtn.right{background:var(--good);color:#fff;border-color:var(--good)}
.gbtn.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}

.chat{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:14px}
.bub{max-width:88%;padding:9px 13px;border-radius:16px;border:2px solid var(--ink);font-weight:600}
.bub.a{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.bub.b{align-self:flex-end;background:var(--accent);color:#1A2340;border-bottom-right-radius:4px}
.who{font-size:.75rem;font-weight:800;opacity:.7;display:block}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid currentColor;text-align:center}
.built{min-height:58px;border:3px dashed var(--muted);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:7px 11px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.built .wt{background:var(--accent);color:#1A2340}
.wt[disabled]{opacity:.25;cursor:default;box-shadow:none}

.topics{display:grid;gap:10px}
.topic{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:12px 14px;text-align:left;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.topic b{display:block;font-size:1.05rem}
.topic small{color:var(--muted);font-weight:600}
details.rule{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 14px;margin-bottom:14px}
details.rule summary{font-weight:800;cursor:pointer}
.rule p{margin:8px 0}
.rule table{border-collapse:collapse;margin:8px 0;font-size:.95rem}
.rule td,.rule th{border-bottom:1px solid var(--muted);padding:3px 10px 3px 0;text-align:left}
.rule th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}

.stat{border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px 14px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.stat h2{font-size:1.15rem;margin:0 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:6px 0 2px}
.mini{height:8px;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--good)}
.muted{color:var(--muted);font-weight:500}
.res{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.res li{border-bottom:2px dashed var(--muted);padding:8px 2px}
.res .you{color:var(--bad);text-decoration:line-through}
.res .right{color:var(--good);font-weight:800}
.big{font-size:2.8rem;font-weight:800;line-height:1}
.center{text-align:center}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.card,.bar span{transition:none}.tile.shake{animation:none}}
</style>
</head>

function conjTable(verbs){
  let h = '<div class="scroll"><table><tr><th></th>' + verbs.map(v=>`<th>${v}</th>`).join('') + '</tr>';
  for(let i=0;i<6;i++) h += `<tr><th>${PR6[i]}</th>` + verbs.map(v=>`<td>${arr(V[v][i]).join(' / ')}</td>`).join('') + '</tr>';
  return h + '</table></div>';
}
function conjItem(verbs, negChance){
  const v = pick(verbs), [p,i] = pick(PRON), neg = Math.random() < negChance;
  let forms = arr(V[v][i]);
  if (neg) forms = forms.map(f => (v==='být' && i===2) ? 'není' : 'ne'+f);

function numWords(n){
  if(n===1000) return ['tisíc'];
  const b100 = r => r<20 ? U[r] : TENS[Math.floor(r/10)] + (r%10 ? ' '+U[r%10] : '');
  const h = Math.floor(n/100), r = n%100, parts = [];
  if(h) parts.push(HUND[h]); if(r || !h) parts.push(b100(r));

function dialItem(d){
  if(d.t==='reply'){
    const others = shuffle(DIAL.filter(x=>x.t==='reply' && x!==d && x.l===d.l)).slice(0,2).map(x=>x.a);
    return {type:'choice', kind:'reply', lines:[['A',d.q]], answers:[d.a], options:shuffle([d.a,...others]), plain:d.q, l:d.l};
  }
  if(d.t==='gap') return {type:'choice', kind:'gap', lines:d.lines, answers:[d.a], options:shuffle(d.o), plain:d.lines.map(x=>x[1]).join(' / '), l:d.l};
  const end = (d.a.match(/[.?!]$/)||[''])[0], words = d.a.replace(/[.?!]$/,'').split(' ');
  return {type:'build', ua:d.ua, answers:[d.a], words, end, tiles:shuffle([...words, ...d.x]), plain:d.ua, l:d.l};
}

/* ---------- STATE ---------- */
const TABS = [['cards','Картки'],['match','Пари'],['write','Письмо'],['gram','Граматика'],['dial','Діалоги'],['test','Тест'],['stats','Прогрес']];
let S = {lesson: [0,1,2,3].includes(P.lesson) ? P.lesson : 1, tab:'cards', topic:'all', swap:false};
let C = null, M = null, Wr = null, G = null, D = null, T = null;
const inL = l => S.lesson===0 || l===S.lesson;
const words = () => W.filter(w => inL(w.l) && (S.topic==='all' || w.t===S.topic));
const lessonTopics = () => [...new Set(W.filter(w=>inL(w.l)).map(w=>w.t))];
const fkey = () => S.lesson+'|'+S.topic;

/* ---------- SHELL ---------- */
function renderShell(){
  const L = LESSONS[S.lesson];
  $('#title').textContent = L ? L.cz : 'Lekce 1-3';
  $('#subtitle').textContent = L ? L.ua : 'Усі уроки разом';
  const locked = T && T.active;
  $('#lessons').innerHTML = [1,2,3,0].map(n => `<button class="les" data-les="${n}" aria-pressed="${S.lesson===n}" ${locked?'disabled':''}>${n ? 'Урок '+n : 'Усі'}</button>`).join('');
  $('#tabs').innerHTML = TABS.map(([k,t]) => `<button class="tab" data-tab="${k}" aria-pressed="${S.tab===k}" ${locked && k!=='test'?'disabled':''}>${t}</button>`).join('');
  const wordMode = ['cards','match','write'].includes(S.tab);
  $('#chips').hidden = !wordMode;
  $('#chips').innerHTML = wordMode ? [['all','Усе'], ...lessonTopics().map(t=>[t,TOPICS[t]])].map(([k,t]) => `<button class="chip" data-topic="${k}" aria-pressed="${S.topic===k}">${t}</button>`).join('') : '';
  $('#legend').innerHTML = wordMode ? '<p class="legend"><span class="g-Ma">чол. жив.</span><span class="g-Mi">чол. нежив.</span><span class="g-F">жін.</span><span class="g-N">сер.</span></p>' : '';
}
function render(){
  renderShell();
  ({cards:rCards, match:rMatch, write:rWrite, gram:rGram, dial:rDial, test:rTest, stats:rStats})[S.tab]();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-les],[data-tab],[data-topic]'); if(!b || b.disabled) return;
  if(b.dataset.les !== undefined){ S.lesson = +b.dataset.les; P.lesson = S.lesson; save(); S.topic='all'; resetModes(); }
  if(b.dataset.tab){ S.tab = b.dataset.tab; if(S.tab==='gram') G=null; }
  if(b.dataset.topic){ S.topic = b.dataset.topic; resetModes(); }
  render();
});
function resetModes(){ C=null; M=null; Wr=null; G=null; D=null; }

/* ---------- CARDS ---------- */
function startCards(){ const list = words().filter(w=>!P.known[w.id]); C = {key:fkey(), deck:shuffle(list), i:0, again:[], flipped:false, between:false}; }
function rCards(){
  if(!C || C.key!==fkey()) startCards();
  const all = words(), knownN = all.filter(w=>P.known[w.id]).length, att = (P.att[fkey()]||0)+1;
  let h = `<p class="help">Натисни на картку, щоб перевернути. Вивчені слова відкладаються, решта повернеться в наступній спробі.</p>
  <div class="progress"><span>Спроба ${att}</span><span>Вивчено ${knownN} / ${all.length}</span></div>
  <div class="bar"><span style="width:${pct(knownN,all.length)}%"></span></div>`;
  if(C.between){
    h += `<div class="q"><div class="emoji">💪</div><p class="prompt">Спробу завершено</p><p class="hint">Ще ${C.again.length} ${C.again.length===1?'картка повернеться':'карток повернуться'}.</p><button class="btn primary wide" data-act="next-attempt">Наступна спроба</button></div>`;
  } else if(C.i >= C.deck.length){
    h += `<div class="q"><div class="emoji">🎉</div><p class="prompt">Усе вивчено!</p><p class="hint">У цьому наборі не лишилось невідомих карток.</p><button class="btn wide" data-act="reset-cards">Почати набір знову</button></div>`;
  } else {
    const w = C.deck[C.i], cz = `<div class="word ${gw(w)}">${esc(w.cz)}</div>${w.g?`<span class="badge ${gw(w)}">${GL[w.g]}</span>`:''}`;
    const ua = `${w.e?`<div class="emoji">${w.e}</div>`:''}<div class="word">${esc(w.ua)}</div>`;
    const [f,b] = S.swap ? [cz,ua] : [ua,cz];
    h += `<div class="scene" data-act="flip" role="button" tabindex="0" aria-label="Перевернути картку"><div class="card ${C.flipped?'flipped':''}">
      <div class="face">${f}<span class="tap">${C.i+1} / ${C.deck.length}</span></div><div class="face back">${b}</div></div></div>
      <div class="actions"><button class="btn again" data-act="again">Ще раз</button><button class="btn good" data-act="know">Знаю</button></div>`;
  }
  h += `<div class="links"><button class="link" data-act="shuffle">Перемішати</button><button class="link" data-act="swap">${S.swap?'Спершу українською':'Спершу чеською'}</button><button class="link" data-act="reset-cards">Скинути картки</button></div>`;
  $('#view').innerHTML = h;
}
function cardAct(a){
  if(a==='flip'){ C.flipped=!C.flipped; $('.card')?.classList.toggle('flipped', C.flipped); return true; }
  if(a==='know' || a==='again'){
    const w = C.deck[C.i]; if(a==='know') P.known[w.id]=1; else C.again.push(w);
    C.i++; C.flipped=false;
    if(C.i>=C.deck.length && C.again.length) C.between = true;
    save(); return false;
  }
  if(a==='next-attempt'){ P.att[fkey()]=(P.att[fkey()]||0)+1; save(); C.deck=shuffle(C.again); C.again=[]; C.i=0; C.between=false; return false; }
  if(a==='shuffle'){ C.deck = C.deck.slice(0,C.i).concat(shuffle(C.deck.slice(C.i))); C.flipped=false; return false; }
  if(a==='swap'){ S.swap=!S.swap; C.flipped=false; return false; }
  if(a==='reset-cards'){ words().forEach(w=>delete P.known[w.id]); delete P.att[fkey()]; save(); startCards(); return false; }
}

/* ---------- MATCH ---------- */
function startMatch(){ M = {key:fkey(), score:0, miss:0, round:0}; newRound(); }
function newRound(){
  const set = shuffle(words()).slice(0,5);
  M.round++; M.set=set; M.left=shuffle(set); M.right=shuffle(set); M.sel=null; M.done=new Set();
}
function rMatch(){
  if(!M || M.key!==fkey()) startMatch();
  if(!M.set.length){ $('#view').innerHTML='<p class="help">У цьому наборі немає слів.</p>'; return; }
  let h = `<p class="help">Вибери чеське слово, а потім його переклад.</p><div class="progress"><span>Раунд ${M.round}</span><span>Пар: ${M.score}, помилок: ${M.miss}</span></div>`;
  h += '<div class="match"><div class="col">' + M.left.map(w=>`<button class="tile ${gw(w)} ${M.done.has(w.id)?'ok':''} ${M.sel===w.id?'sel':''}" data-act="ml" data-id="${esc(w.id)}" ${M.done.has(w.id)?'disabled':''}>${esc(w.cz)}</button>`).join('') + '</div><div class="col">'
     + M.right.map(w=>`<button class="tile ${M.done.has(w.id)?'ok':''}" data-act="mr" data-id="${esc(w.id)}" ${M.done.has(w.id)?'disabled':''}>${w.e?w.e+' ':''}${esc(w.ua)}</button>`).join('') + '</div></div>';
  if(M.done.size===M.set.length) h += `<button class="btn primary wide" data-act="mnext">Наступний раунд</button>`;
  $('#view').innerHTML = h;
  if(M.shake){ [...document.querySelectorAll('[data-act="mr"]')].find(x=>x.dataset.id===M.shake)?.classList.add('shake'); M.shake=null; }
}
function matchAct(a, b){
  if(a==='ml'){ M.sel = b.dataset.id; return false; }
  if(a==='mr'){
    if(!M.sel) return true;
    if(b.dataset.id===M.sel){ M.done.add(M.sel); M.score++; M.sel=null; if(M.done.size===M.set.length){ P.match.rounds++; save(); } return false; }
    M.miss++; P.match.miss++; miss(M.sel); save(); M.shake=b.dataset.id; return false;
  }
  if(a==='mnext'){ newRound(); return false; }
}

/* ---------- WRITE ---------- */
function startWrite(){ const q = shuffle(words()).slice(0,15); q.forEach(w=>w._back=false); Wr = {key:fkey(), queue:q, size:q.length, cleared:0, hints:0, tries:0, state:null, fb:''}; }
function skeleton(ans, n){
  let k = 0;
  return [...ans].map(ch => /\p{L}/u.test(ch) ? (k++ < n ? ch : '_') : (ch===' ' ? '\u2003' : ch)).join(' ');
}
function rWrite(){
  if(!Wr || Wr.key!==fkey()) startWrite();
  if(!Wr.size){ $('#view').innerHTML='<p class="help">У цьому наборі немає слів.</p>'; return; }
  let h = `<p class="help">Напиши чеською. Чеські літери - на панелі під полем.</p>
  <div class="progress"><span>Залишилось ${Wr.queue.length}</span><span>Точність ${pct(P.write.ok,P.write.total)}%</span></div>
  <div class="bar"><span style="width:${pct(Wr.cleared,Wr.size)}%"></span></div>`;
  if(!Wr.queue.length){
    h += `<div class="q"><div class="emoji">✨</div><p class="prompt">Готово!</p><p class="hint">Підказок використано: ${Wr.hints}</p><button class="btn primary wide" data-act="wrestart">Ще 15 слів</button></div>`;
    $('#view').innerHTML = h; return;
  }
  const w = Wr.queue[0], shown = Wr.state==='reveal';
  h += `<div class="q">${w.e?`<div class="emoji">${w.e}</div>`:''}<p class="prompt">${esc(w.ua)}</p>
    <p class="pattern" aria-label="Кількість літер">${esc(skeleton(w.ans[0], shown ? 999 : (Wr.hintNow||0)))}</p>
    <input class="ans ${Wr.state==='ok'?'good':Wr.state&&Wr.state!=='almost'?'bad':''}" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Відповідь" ${shown||Wr.state==='ok'?`disabled value="${esc(Wr.v||'')}"`:''}>
    ${diaBar()}
    <div class="fb ${Wr.state==='ok'?'good':Wr.state==='almost'?'almost':'bad'}" aria-live="polite">${Wr.fb}</div>
    <div class="actions">${shown||Wr.state==='ok' ? `<button class="btn primary" data-act="wnext" style="grid-column:1/-1">Далі</button>`
      : `<button class="btn" data-act="whint">Підказка</button><button class="btn primary" data-act="wcheck">Перевірити</button>`}</div></div>`;
  $('#view').innerHTML = h;
  const inp = $('#answer'); if(inp && !inp.disabled) inp.focus(); else $('[data-act="wnext"]')?.focus();
}
function writeAct(a){
  const w = Wr.queue[0];
  if(a==='whint'){ Wr.hints++; w._h = (w._h||0)+1; Wr.hintNow=(Wr.hintNow||0)+1; P.write.hint++; save(); const v=$('#answer').value; rWriteKeep(v); return true; }
  if(a==='wcheck'){
    const v = $('#answer').value, r = judge(v, w.ans); if(r==='empty') return true;
    if(r==='ok'){
      P.write.total++; const clean = !Wr.hintNow && !Wr.tries;
      if(clean){ P.write.ok++; } Wr.v=v; Wr.state='ok'; Wr.fb = clean ? 'Правильно!' : `Правильно! Слово повернеться ще раз.`; w._back = !clean; save(); return false;
    }
    Wr.tries++;
    if(Wr.tries===1){ Wr.state = r==='almost'?'almost':'bad'; Wr.fb = r==='almost' ? 'Майже! Перевір діакритику (háček, čárka).' : 'Ні, спробуй ще раз.'; rWriteKeep(v); return true; }
    P.write.total++; miss(w.id); save(); Wr.v=v; Wr.state='reveal'; Wr.fb = `Правильно: ${esc(w.ans.join(' / '))}`; w._back = true; return false;
  }
  if(a==='wnext'){
    Wr.queue.shift(); if(w._back){ Wr.queue.push(w); } else Wr.cleared++;
    w._back=false; Wr.tries=0; Wr.hintNow=0; Wr.state=null; Wr.fb=''; return false;
  }
  if(a==='wrestart'){ startWrite(); return false; }
}
function rWriteKeep(v){ rWrite(); const i=$('#answer'); if(i){ i.value=v; i.focus(); } }

/* ---------- GRAMMAR ---------- */
const lessonGram = () => GRAM.filter(g => S.lesson===0 ? true : g.ls.includes(S.lesson));
function rGram(){
  if(!G){
    const list = lessonGram();
    $('#view').innerHTML = `<p class="help">Вибери тему: спершу коротке правило, потім 10 завдань.</p><div class="topics">` +
      list.map(g => { const s = P.gram[g.id]; return `<button class="topic" data-act="gopen" data-id="${g.id}"><b>${esc(g.title)}</b><small>${esc(g.sub)}${s?` - точність ${pct(s.ok,s.total)}%`:''}</small></button>`; }).join('') + '</div>';
    return;
  }
  const g = GRAM.find(x=>x.id===G.id);
  let h = `<button class="link" data-act="gback">← Усі теми</button><h2 style="margin:4px 0 10px">${esc(g.title)}</h2>
  <details class="rule" ${G.i===0 && !G.answered ? 'open':''}><summary>Правило</summary>${g.rule}</details>`;
  if(G.i >= G.items.length){
    h += `<div class="q"><p class="big">${G.ok} / ${G.items.length}</p><p class="hint">${G.ok===G.items.length?'Бездоганно!':G.ok>=7?'Добре, ще трохи практики.':'Варто перечитати правило і спробувати ще.'}</p>
      <div class="actions"><button class="btn" data-act="gback">До тем</button><button class="btn primary" data-act="grestart">Ще 10</button></div></div>`;
  } else {
    h += `<div class="progress"><span>Завдання ${G.i+1} / ${G.items.length}</span><span>Правильно: ${G.ok}</span></div>` + itemHTML(G.items[G.i], G, 'g');
  }
  $('#view').innerHTML = h;
  focusMain();
}
function startGram(id){ const g = GRAM.find(x=>x.id===id); G = {id, items:Array.from({length:10}, g.gen), i:0, ok:0, answered:null}; }

/* shared item renderer for grammar / dialogues / test */
function itemHTML(it, st, pre, strict){
  const done = st.answered, correct = done && done.ok;
  let body = '';
  if(it.lines) body += '<div class="chat">' + it.lines.map(([who,t]) => `<div class="bub ${who==='A'?'a':'b'}">${esc(t).replace('___','<span class="gap">'+(done&&!strict? esc(it.answers[0]) : '&nbsp;')+'</span>')}</div>`).join('') + '</div>';
  if(it.type==='type'){
    body += `<p class="prompt">${it.prompt.includes('<') ? it.prompt : esc(it.prompt)}</p>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:''}
      <input class="ans ${done?(correct?'good':'bad'):''}" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Відповідь" ${done?'disabled':''} value="${done?esc(done.v):''}">${done?'':diaBar()}`;
  } else if(it.type==='gender'){
    body += `<p class="prompt">${esc(it.prompt)}</p><p class="hint">${esc(it.hint)}</p><div class="gbtns">` +
      ['Ma','Mi','F','N'].map(k => `<button class="gbtn g-${k} ${done&&!strict? (k===it.answers[0]?'right':(done.v===k?'wrong':'')) : ''}" data-act="${pre}pick" data-v="${k}" ${done?'disabled':''}>${GL[k]}</button>`).join('') + '</div>';
  } else if(it.type==='choice'){
    if(it.prompt) body += `<p class="prompt">${esc(it.prompt)}</p>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:''}`;
    if(it.kind==='reply') body += '<p class="hint">Вибери найкращу відповідь</p>';
    body += '<div class="opts">' + it.options.map(o => `<button class="opt ${done&&!strict?(o===it.answers[0]?'right':(done.v===o?'wrong':'')):''}" data-act="${pre}pick" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('') + '</div>';
  } else if(it.type==='build'){
    const used = st.built || [];
    body += `<p class="prompt">${esc(it.ua)}</p><p class="hint">Склади речення чеською</p>
      <div class="built" aria-label="Твоє речення">${used.map((ti,k)=>`<button class="wt" data-act="${pre}unb" data-k="${k}" ${done?'disabled':''}>${esc(it.tiles[ti])}</button>`).join('')}${used.length?esc(it.end):''}</div>
      <div class="pool">${it.tiles.map((t,ti)=>`<button class="wt" data-act="${pre}b" data-k="${ti}" ${used.includes(ti)||done?'disabled':''}>${esc(t)}</button>`).join('')}</div>`;
  }
  let fb = '';
  if(done && !strict) fb = correct ? '<div class="fb good">Правильно!</div>' : `<div class="fb ${done.r==='almost'?'almost':'bad'}">${done.r==='almost'?'Майже! Діакритика: ':'Правильно: '}${esc(it.answers[0])}</div>`;
  let btn = '';
  if(done) btn = `<button class="btn primary wide" data-act="${pre}next">Далі</button>`;
  else if(it.type==='type' || it.type==='build') btn = `<button class="btn primary wide" data-act="${pre}check">${strict?'Відповісти':'Перевірити'}</button>`;
  return `<div class="q">${body}${fb}${btn}</div>`;
}
/* evaluate current item; returns {ok, v, r} or null if empty */
function evalItem(it, st, via){
  if(it.type==='type'){ const v=$('#answer').value, r=judge(v,it.answers); if(r==='empty') return null; return {ok:r==='ok', v, r}; }
  if(it.type==='build'){ const used=st.built||[]; if(!used.length) return null; const v=used.map(k=>it.tiles[k]).join(' ')+it.end; const r=judge(v,it.answers); return {ok:r==='ok', v, r}; }
  const v = via; return {ok: v===it.answers[0], v, r: v===it.answers[0]?'ok':'bad'};
}
function itemAct(a, b, st, pre, onDone){
  const it = st.items[st.i];
  if(a===pre+'b'){ st.built=[...(st.built||[]), +b.dataset.k]; return 'rerender'; }
  if(a===pre+'unb'){ st.built=(st.built||[]).filter((_,k)=>k!==+b.dataset.k); return 'rerender'; }
  if(a===pre+'check' || a===pre+'pick'){
    const res = evalItem(it, st, b.dataset.v); if(!res) return 'noop';
    st.answered = res; if(res.ok) st.ok++; onDone(it, res); return 'rerender';
  }
  if(a===pre+'next'){ st.i++; st.answered=null; st.built=[]; return 'rerender'; }
  return null;
}

/* ---------- DIALOGUES ---------- */
function startDial(){ const pool = DIAL.filter(d=>inL(d.l)); D = {key:S.lesson, items:shuffle(pool).slice(0,10).map(dialItem), i:0, ok:0, answered:null, built:[]}; }
function rDial(){
  if(!D || D.key!==S.lesson) startDial();
  let h = `<p class="help">Живі ситуації: відповісти на репліку, заповнити пропуск, скласти речення.</p>`;
  if(D.i >= D.items.length){
    h += `<div class="q"><p class="big">${D.ok} / ${D.items.length}</p><p class="hint">Раунд діалогів завершено.</p><button class="btn primary wide" data-act="drestart">Новий раунд</button></div>`;
  } else h += `<div class="progress"><span>${D.i+1} / ${D.items.length}</span><span>Правильно: ${D.ok}</span></div>` + itemHTML(D.items[D.i], D, 'd');
  $('#view').innerHTML = h;
  focusMain();
}
function focusMain(){ const i=$('#answer:not([disabled])'); if(i) i.focus(); else $('[data-act$="next"]')?.focus(); }

/* ---------- TEST ---------- */
function buildTest(){
  const ws = shuffle(W.filter(w=>inL(w.l))).slice(0,10).map(w => ({type:'type', prompt:w.ua, hint:'', answers:w.ans, plain:w.ua, wid:w.id}));
  const gs = lessonGram(); const gi = Array.from({length:6}, () => { const it = pick(gs).gen(); it.plain = it.plain || (it.type==='gender' ? it.prompt+' (рід)' : it.prompt.replace(/<[^>]+>/g,'')+' '+(it.hint||'')); return it; });
  const ds = shuffle(DIAL.filter(d=>inL(d.l))).slice(0,4).map(dialItem);
  return shuffle([...ws, ...gi, ...ds]);
}
function rTest(){
  if(!T || !T.active){
    let h = `<div class="q"><div class="emoji">📝</div><p class="prompt">Тест: ${S.lesson ? 'урок '+S.lesson : 'уроки 1-3'}</p>
      <p class="hint">20 завдань: слова, граматика, діалоги. Без підказок, вставка тексту вимкнена. Відповіді покажу в кінці.</p>
      <button class="btn primary wide" data-act="tstart">Почати тест</button></div>`;
    if(T && T.result) h = resultHTML() + h;
    $('#view').innerHTML = h; return;
  }
  const it = T.items[T.i];
  $('#view').innerHTML = `<div class="progress"><span>Питання ${T.i+1} / ${T.items.length}</span><span>${T.leaves?`Виходів з вкладки: ${T.leaves}`:''}</span></div>
   <div class="bar"><span style="width:${pct(T.i,T.items.length)}%"></span></div>` + itemHTML(it, T, 't', true);
  const inp = $('#answer'); if(inp){ inp.focus(); inp.addEventListener('paste', e=>e.preventDefault()); inp.addEventListener('drop', e=>e.preventDefault()); }
}
function testAct(a, b){
  if(a==='tstart'){ T = {active:true, items:buildTest(), i:0, ok:0, answered:null, built:[], log:[], leaves:0}; renderShell(); return 'rerender'; }
  const it = T.items[T.i];
  if(a==='tb'){ T.built=[...(T.built||[]), +b.dataset.k]; return 'rerender'; }
  if(a==='tunb'){ T.built=T.built.filter((_,k)=>k!==+b.dataset.k); return 'rerender'; }
  if(a==='tcheck' || a==='tpick'){
    const res = evalItem(it, T, b.dataset.v); if(!res) return;
    if(res.ok) T.ok++; else if(it.wid) miss(it.wid);
    T.log.push({q:it.plain || it.prompt, v:res.v, a:it.answers[0], ok:res.ok, g:it.type==='gender'});
    T.i++; T.built=[];
    if(T.i >= T.items.length){
      T.active=false; T.result={ok:T.ok, total:T.items.length, leaves:T.leaves, log:T.log};
      P.tests.unshift({d:today(), l:S.lesson, ok:T.ok, total:T.items.length, leaves:T.leaves}); P.tests = P.tests.slice(0,30); save(); renderShell();
    }
    return 'rerender';
  }
}
function resultHTML(){
  const r = T.result, wrong = r.log.filter(x=>!x.ok), show = v => GL[v] || v;
  return `<div class="q" style="margin-bottom:16px"><p class="big">${r.ok} / ${r.total}</p><p class="hint">${pct(r.ok,r.total)}%${r.leaves?`, виходів з вкладки: ${r.leaves}`:''}</p>
   ${wrong.length ? '<ul class="res">' + wrong.map(x=>`<li>${esc(x.q)}<br><span class="you">${esc(x.g?show(x.v):x.v||'-')}</span> → <span class="right">${esc(x.g?show(x.a):x.a)}</span></li>`).join('') + '</ul>' : '<p class="fb good">Жодної помилки!</p>'}</div>`;
}
document.addEventListener('visibilitychange', () => { if(document.hidden && T && T.active){ T.leaves++; } });

/* ---------- STATS ---------- */
function rStats(){

  for(const l of [1,2,3]){

    const gs = GRAM.filter(g=>g.ls[0]===l).map(g=>{ const s=P.gram[g.id]; return `<div class="row"><span>${esc(g.title)}</span><span class="muted">${s?pct(s.ok,s.total)+'% ('+s.total+')':'-'}</span></div>`; }).join('');
    const d = P.dial[l];
    h += `<div class="stat"><h2>Урок ${l}. ${esc(LESSONS[l].cz)}</h2>

    <div class="row"><span>Підказок</span><span>${P.write.hint}</span></div><div class="row"><span>Раундів пар</span><span>${P.match.rounds}, помилок ${P.match.miss}</span></div></div>
    <div class="stat"><h2>Найважчі слова</h2>${hard || '<p class="muted">Поки що помилок немає.</p>'}</div>
    <div class="stat"><h2>Історія тестів</h2>${P.tests.length ? P.tests.map(t=>`<div class="row"><span>${esc(t.d)} <span class="muted">${t.l?'урок '+t.l:'усі'}</span></span><span>${t.ok}/${t.total}${t.leaves?' <span class="muted">('+t.leaves+'↗)</span>':''}</span></div>`).join('') : '<p class="muted">Тестів ще не було.</p>'}</div>
    <button class="btn again wide" data-act="resetall">${S.confirm?'Точно? Натисни ще раз':'Скинути весь прогрес'}</button>`;
  $('#view').innerHTML = h;
}

/* ---------- EVENTS ---------- */
$('#view').addEventListener('pointerdown', e => { if(e.target.closest('[data-act="dia"]')) e.preventDefault(); });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a==='dia'){ const i=$('#answer'); if(!i||i.disabled) return; const s=i.selectionStart??i.value.length, en=i.selectionEnd??s; i.value=i.value.slice(0,s)+b.dataset.ch+i.value.slice(en); i.setSelectionRange(s+1,s+1); i.focus(); return; }
  if(a!=='resetall') S.confirm=false;
  let keep = false;
  if(S.tab==='cards') keep = cardAct(a);
  else if(S.tab==='match') keep = matchAct(a,b);
  else if(S.tab==='write') keep = writeAct(a);
  else if(S.tab==='gram'){
    if(a==='gopen'){ startGram(b.dataset.id); }
    else if(a==='gback'){ G=null; }
    else if(a==='grestart'){ startGram(G.id); }
    else { const r = itemAct(a,b,G,'g',(it,res)=>{ const s=P.gram[G.id]||(P.gram[G.id]={ok:0,total:0}); s.total++; if(res.ok) s.ok++; if(!res.ok && it.wid) miss(it.wid); save(); }); if(r==='noop') return; }
  }
  else if(S.tab==='dial'){
    if(a==='drestart') startDial();
    else { const r = itemAct(a,b,D,'d',(it,res)=>{ const s=P.dial[it.l]||(P.dial[it.l]={ok:0,total:0}); s.total++; if(res.ok) s.ok++; save(); }); if(r==='noop') return; }
  }
  else if(S.tab==='test'){ testAct(a,b); }
  else if(S.tab==='stats' && a==='resetall'){
    if(!S.confirm){ S.confirm=true; } else { S.confirm=false; const l=P.lesson; P=blank(); P.lesson=l; save(); resetModes(); }
  }
  if(!keep) render();
});
